<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Chat App</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    margin:0;
}

.header{
    background:#6a00ff;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

#chat{
    height:75vh;
    overflow-y:auto;
    padding:10px;
}

.user{
    text-align:right;
    margin:10px;
}

.bot{
    text-align:left;
    margin:10px;
}

.bubble{
    display:inline-block;
    padding:10px;
    border-radius:12px;
    max-width:70%;
}

.user .bubble{
    background:#6a00ff;
}

.bot .bubble{
    background:#333;
}

.input-area{
    display:flex;
    position:fixed;
    bottom:0;
    width:100%;
}

input{
    flex:1;
    padding:15px;
    border:none;
}

button{
    width:80px;
    border:none;
    background:#6a00ff;
    color:white;
}
</style>
</head>

<body>

<div class="header">My AI Chat</div>

<div id="chat"></div>

<div class="input-area">
<input id="msg" placeholder="Type a message...">
<button onclick="send()">Send</button>
</div>

<script>
function send(){
    let text=document.getElementById("msg").value;
    if(!text) return;

    let chat=document.getElementById("chat");

    chat.innerHTML +=
    `<div class="user"><div class="bubble">${text}</div></div>`;

    let reply="Interesting.";

    if(text.toLowerCase().includes("hi"))
        reply="Hello!";
    else if(text.toLowerCase().includes("love"))
        reply="Tell me more ❤️";
    else if(text.toLowerCase().includes("name"))
        reply="I'm your personal AI.";

    chat.innerHTML +=
    `<div class="bot"><div class="bubble">${reply}</div></div>`;

    document.getElementById("msg").value="";
    chat.scrollTop=chat.scrollHeight;
}
</script>

</body>
</html>
